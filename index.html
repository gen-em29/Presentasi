<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zalva Study Planner 🎀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap');
        
        :root {
            --soft-pink: #FFFBFC;
            --accent-pink: #FFD1DC;
            --deep-pink: #FF85A1;
            --text-color: #5D4D50;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--soft-pink);
            color: var(--text-color);
            -webkit-tap-highlight-color: transparent;
        }

        .coquette-border {
            border: 2px solid var(--accent-pink);
            box-shadow: 0 10px 20px rgba(255, 209, 220, 0.3);
        }

        .active-tab {
            background-color: var(--deep-pink);
            color: white !important;
            box-shadow: 0 8px 15px rgba(255, 133, 161, 0.4);
        }

        .fancy-font {
            font-family: 'Dancing Script', cursive;
        }

        .session-card {
            transition: all 0.3s ease;
        }

        .session-card:active {
            transform: scale(0.97);
        }

        .hide-scroll::-webkit-scrollbar { display: none; }

        /* Custom Checkbox */
        .pink-check {
            width: 24px;
            height: 24px;
            border: 2px solid var(--accent-pink);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        input:checked + .pink-check {
            background-color: var(--deep-pink);
            border-color: var(--deep-pink);
            color: white;
        }
    </style>
</head>
<body class="pb-10">

    <!-- Top Navigation -->
    <nav class="sticky top-0 bg-white/80 backdrop-blur-md z-40 p-5 flex justify-between items-center border-b border-pink-100">
        <div>
            <h1 class="fancy-font text-3xl text-[#FF85A1]">Zalva's Planner 🎀</h1>
            <p class="text-[9px] font-black uppercase tracking-[0.2em] text-pink-300">Universitas Terbuka 2025</p>
        </div>
        <div class="flex gap-3">
            <button onclick="showTab('home')" id="nav-home" class="w-10 h-10 rounded-full flex items-center justify-center text-pink-300 active-tab"><i class="fa-solid fa-house"></i></button>
            <button onclick="showTab('courses')" id="nav-courses" class="w-10 h-10 rounded-full flex items-center justify-center text-pink-300"><i class="fa-solid fa-book-open"></i></button>
        </div>
    </nav>

    <main class="p-6 max-w-2xl mx-auto">
        
        <!-- HOME TAB: REMINDERS -->
        <section id="tab-home" class="space-y-6">
            <div class="bg-gradient-to-br from-pink-50 to-white p-6 rounded-[2rem] coquette-border">
                <h2 class="font-black text-lg mb-1">Halo, Zalva Cantik! ✨</h2>
                <p class="text-xs text-slate-500 mb-4">Minggu ini ada beberapa tugas yang harus diselesaikan:</p>
                
                <div id="urgentReminders" class="space-y-3">
                    <!-- Reminders will be injected here -->
                </div>
            </div>

            <div class="flex items-center justify-between px-2">
                <h3 class="font-black text-sm uppercase tracking-widest text-pink-400">Ringkasan Matkul</h3>
                <span class="text-[10px] font-bold text-slate-400">8 Mata Kuliah</span>
            </div>

            <div class="grid grid-cols-1 gap-4" id="miniCourseList">
                <!-- Mini course cards -->
            </div>
        </section>

        <!-- COURSES TAB -->
        <section id="tab-courses" class="hidden space-y-6">
            <div id="courseDetailView" class="hidden animate-in fade-in slide-in-from-bottom-4">
                <button onclick="backToCourses()" class="mb-4 text-pink-400 text-xs font-bold uppercase tracking-widest flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar
                </button>
                <div id="courseHeader" class="mb-8"></div>
                <div id="sessionGrid" class="grid grid-cols-3 md:grid-cols-4 gap-3"></div>
            </div>

            <div id="mainCourseList" class="space-y-4">
                <h2 class="font-black text-xl mb-4 italic">Daftar Mata Kuliah 📚</h2>
                <!-- Course list will be injected here -->
            </div>
        </section>

    </main>

    <!-- MODAL SESSION -->
    <div id="sessionModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-end justify-center">
        <div class="bg-white w-full max-w-xl rounded-t-[3rem] p-8 space-y-6 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center">
                <div id="modalHeader"></div>
                <button onclick="closeModal()" class="w-10 h-10 bg-pink-50 rounded-full text-pink-400 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4">
                <div id="taskPrompt" class="p-4 bg-pink-50 rounded-2xl border border-pink-100"></div>
                
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase text-pink-300 tracking-widest px-1">Draf Jawaban / Catatan Belajar</label>
                    <textarea id="studyNote" class="w-full bg-slate-50 border-none rounded-[1.5rem] p-5 text-sm focus:ring-2 focus:ring-pink-200 outline-none min-h-[150px]" placeholder="Tuliskan draf jawaban diskusimu di sini supaya tidak lupa..."></textarea>
                </div>

                <div class="flex items-center gap-3 p-4 bg-white border border-pink-100 rounded-2xl">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="checkDone" class="hidden">
                        <div class="pink-check"><i class="fa-solid fa-check text-xs"></i></div>
                        <span class="text-xs font-bold">Sudah saya jawab di portal UT</span>
                    </label>
                </div>

                <button onclick="saveSession()" class="w-full bg-[#FF85A1] text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg shadow-pink-100">Simpan Progress 🎀</button>
            </div>
        </div>
    </div>

    <script>
        // Data Mata Kuliah Zalva dari Foto
        const zalvaCourses = [
            { id: 1, name: "Akuntansi Keuangan Dasar 58", type: "praton", code: "FHISIP" },
            { id: 2, name: "Filsafat Bisnis 65", type: "tuton", code: "FHISIP" },
            { id: 3, name: "Kewirausahaan di Era Digital 1052", type: "tuton", code: "FKIP" },
            { id: 4, name: "Manajemen Sumber Daya Manusia 780", type: "tuton", code: "FE" },
            { id: 5, name: "Pengantar Bisnis 136", type: "tuton", code: "FHISIP" },
            { id: 6, name: "Pengantar Statistika 755", type: "tuton", code: "FST" },
            { id: 7, name: "Perencanaan dan Pengembangan Bisnis 27", type: "praton", code: "FHISIP" },
            { id: 8, name: "Sosiologi Industri 49", type: "tuton", code: "FHISIP" }
        ];

        // State Management
        let userProgress = JSON.parse(localStorage.getItem('zalva_progress')) || {};
        let activeCourse = null;
        let activeSession = null;

        function showTab(tab) {
            document.getElementById('tab-home').classList.toggle('hidden', tab !== 'home');
            document.getElementById('tab-courses').classList.toggle('hidden', tab !== 'courses');
            document.getElementById('nav-home').classList.toggle('active-tab', tab === 'home');
            document.getElementById('nav-courses').classList.toggle('active-tab', tab === 'courses');
            
            if(tab === 'home') renderHome();
            else renderCourseList();
        }

        function renderHome() {
            const reminderContainer = document.getElementById('urgentReminders');
            const miniList = document.getElementById('miniCourseList');
            reminderContainer.innerHTML = '';
            miniList.innerHTML = '';

            // Cari sesi yang belum selesai (Minggu 1-8 adalah standar UT)
            let pendingCount = 0;
            zalvaCourses.forEach(course => {
                // Tampilkan card mini
                const doneCount = Object.keys(userProgress[course.id] || {}).filter(k => userProgress[course.id][k].done).length;
                miniList.innerHTML += `
                    <div onclick="openCourse(${course.id})" class="bg-white p-4 rounded-2xl border border-pink-50 flex items-center justify-between shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-pink-50 flex items-center justify-center text-pink-400">
                                <i class="fa-solid ${course.type === 'tuton' ? 'fa-comments' : 'fa-clipboard-list'}"></i>
                            </div>
                            <div class="max-w-[150px]">
                                <h4 class="text-[11px] font-black truncate">${course.name}</h4>
                                <div class="w-24 bg-pink-50 h-1.5 rounded-full mt-1 overflow-hidden">
                                    <div class="bg-[#FF85A1] h-full" style="width: ${(doneCount/8)*100}%"></div>
                                </div>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-[10px] text-pink-100"></i>
                    </div>
                `;

                // Logika pengingat otomatis (Contoh minggu berjalan adalah Minggu 3)
                const currentWeek = 3; 
                const taskKey = `s${currentWeek}`;
                const isDone = userProgress[course.id]?.[taskKey]?.done;

                if(!isDone) {
                    let taskName = course.type === 'tuton' ? "Diskusi" : "Baca Materi";
                    if(currentWeek % 3 === 0) {
                        taskName = course.type === 'tuton' ? "🔥 Tugas Makalah" : "🔥 Tugas Wawancara";
                    }

                    reminderContainer.innerHTML += `
                        <div onclick="openSession(${course.id}, ${currentWeek})" class="flex items-center gap-3 bg-white/60 p-3 rounded-xl border border-white">
                            <div class="w-8 h-8 bg-pink-100 rounded-lg flex items-center justify-center text-[10px] text-pink-500 font-black">${currentWeek}</div>
                            <div class="flex-1">
                                <p class="text-[10px] font-black uppercase text-pink-400">${course.name.substring(0, 20)}...</p>
                                <p class="text-xs font-bold text-slate-700">${taskName} Minggu ${currentWeek}</p>
                            </div>
                            <i class="fa-solid fa-circle-exclamation text-pink-300 animate-pulse"></i>
                        </div>
                    `;
                    pendingCount++;
                }
            });

            if(pendingCount === 0) {
                reminderContainer.innerHTML = '<div class="text-center py-4 text-xs font-bold text-pink-400">Yey! Semua tugas minggu ini sudah beres ✨</div>';
            }
        }

        function renderCourseList() {
            const list = document.getElementById('mainCourseList');
            list.innerHTML = `<h2 class="font-black text-xl mb-4 italic">Daftar Mata Kuliah 📚</h2>`;
            
            zalvaCourses.forEach(c => {
                const doneCount = Object.keys(userProgress[c.id] || {}).filter(k => userProgress[c.id][k].done).length;
                list.innerHTML += `
                    <div onclick="openCourse(${c.id})" class="bg-white p-6 rounded-[2rem] coquette-border flex items-center justify-between animate-pop">
                        <div>
                            <span class="text-[8px] font-black uppercase tracking-widest px-2 py-0.5 bg-pink-50 text-pink-400 rounded-md mb-2 inline-block">${c.type}</span>
                            <h3 class="font-black text-slate-800">${c.name}</h3>
                            <p class="text-[10px] text-slate-400 font-bold mt-1">${doneCount} dari 12 Sesi Selesai</p>
                        </div>
                        <div class="w-12 h-12 bg-pink-50 rounded-2xl flex items-center justify-center text-pink-400">
                            <i class="fa-solid fa-arrow-right-long"></i>
                        </div>
                    </div>
                `;
            });
        }

        function openCourse(id) {
            activeCourse = zalvaCourses.find(c => c.id === id);
            document.getElementById('mainCourseList').classList.add('hidden');
            document.getElementById('courseDetailView').classList.remove('hidden');
            
            document.getElementById('courseHeader').innerHTML = `
                <span class="text-[10px] font-black uppercase tracking-widest text-pink-300">${activeCourse.type}</span>
                <h2 class="text-2xl font-black italic">${activeCourse.name}</h2>
            `;

            const grid = document.getElementById('sessionGrid');
            grid.innerHTML = '';
            for(let i=1; i<=12; i++) {
                const isDone = userProgress[id]?.[`s${i}`]?.done;
                grid.innerHTML += `
                    <button onclick="openSession(${id}, ${i})" class="session-card aspect-square rounded-2xl flex flex-col items-center justify-center gap-1 border-2 ${isDone ? 'bg-pink-500 border-pink-500 text-white shadow-lg shadow-pink-100' : 'bg-white border-pink-50 text-pink-300'}">
                        <span class="text-[10px] font-black opacity-60">SESI</span>
                        <span class="text-xl font-black">${i}</span>
                    </button>
                `;
            }
        }

        function backToCourses() {
            document.getElementById('mainCourseList').classList.remove('hidden');
            document.getElementById('courseDetailView').classList.add('hidden');
            renderCourseList();
        }

        function openSession(courseId, sessionNum) {
            activeCourse = zalvaCourses.find(c => c.id === courseId);
            activeSession = sessionNum;
            
            document.getElementById('sessionModal').classList.remove('hidden');
            document.getElementById('modalHeader').innerHTML = `
                <p class="text-[10px] font-black text-pink-300 uppercase tracking-widest">${activeCourse.name}</p>
                <h4 class="text-lg font-black italic">Sesi ${sessionNum} ✨</h4>
            `;

            // Logika Tugas
            let prompt = "";
            if(activeCourse.type === 'tuton') {
                prompt = sessionNum % 3 === 0 
                    ? "📌 <b>Tugas Wajib:</b> Kerjakan Tugas Makalah dan upload di portal UT."
                    : "💬 <b>Diskusi Mingguan:</b> Jawab pertanyaan diskusi di forum sesuai materi sesi ini.";
            } else {
                prompt = sessionNum % 3 === 0
                    ? "📸 <b>Tugas Wawancara/Essay:</b> Lakukan wawancara atau tulis essay sesuai panduan Praton."
                    : "📖 <b>Materi Sesi:</b> Pelajari modul dan materi inisiasi. Tidak ada diskusi wajib minggu ini.";
            }
            document.getElementById('taskPrompt').innerHTML = prompt;

            // Load Data
            const data = userProgress[courseId]?.[`s${sessionNum}`] || { note: '', done: false };
            document.getElementById('studyNote').value = data.note;
            document.getElementById('checkDone').checked = data.done;
        }

        function closeModal() {
            document.getElementById('sessionModal').classList.add('hidden');
        }

        function saveSession() {
            if(!userProgress[activeCourse.id]) userProgress[activeCourse.id] = {};
            
            userProgress[activeCourse.id][`s${activeSession}`] = {
                note: document.getElementById('studyNote').value,
                done: document.getElementById('checkDone').checked,
                updatedAt: new Date().toISOString()
            };

            localStorage.setItem('zalva_progress', JSON.stringify(userProgress));
            closeModal();
            
            if(!document.getElementById('courseDetailView').classList.contains('hidden')) {
                openCourse(activeCourse.id);
            } else {
                renderHome();
            }
        }

        // Init
        window.onload = () => {
            renderHome();
        }
    </script>
</body>
</html>

```
